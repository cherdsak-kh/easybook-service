name: CI
run-name: CI - ${{ github.ref_name }} staging (by @${{ github.actor }}) -- ${{ github.event.head_commit.message }}

# Test/lint (and audit) gate the Docker build+push — the build job only runs if `verify`
# succeeds, and image push only happens on a push to master (never on a PR), never with `latest`.
on:
  push:
    branches: [master]
    # Docs/planning-only pushes skip CI entirely — and therefore CD too (it fires on CI's
    # `workflow_run`), so a README edit no longer redeploys byte-identical code to staging.
    # push only, not pull_request: a filtered PR would leave required status checks pending.
    paths-ignore: ['**/*.md', 'docs/**', 'claude_planning/**', '.vscode/**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Type-aware ESLint rules (no-unsafe-member-access, etc.) resolve Prisma enums/client
        # methods as `any` without a generated client on disk. `prisma generate` itself never
        # touches a live database, but Prisma 7's config file (prisma.config.ts) resolves
        # DATABASE_URL eagerly and throws if it's unset — so a syntactically valid dummy value
        # is enough here; no real database is required for this step.
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: npm audit (fails the build — never auto-fixed here)
        # High/critical vulnerabilities fail CI outright. Do NOT change this to `audit fix
        # --force` in this workflow — that silently pulls in breaking major-version bumps.
        # A real finding here is a devops/backend-dev decision, not something CI auto-resolves.
        #
        # Runs through audit-ci rather than bare `npm audit` so that documented, non-applicable
        # transitive advisories can be allowlisted by id in .audit-ci.json without lowering the
        # severity threshold for everything else. Matches easybook-app's audit gate convention.
        # Runs before lint/typecheck/tests so a real advisory fails in seconds, not after Jest.
        run: npx audit-ci --config .audit-ci.json

      - name: Lint
        # lint:ci, NOT lint — `lint` carries `--fix`, which on this throwaway checkout would
        # silently repair every auto-fixable violation and pass. lint:ci reports them instead.
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          REDIS_URL: redis://localhost:6379/0


  build-and-push:
    name: Build & push image to GHCR (SHA tag)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What the running container will answer at GET /api/v1/system/version. Computed here rather
      # than read from the environment inside the image: the container has no `.git`, and
      # `npm_package_version` is unset because it starts `node dist/main.js`, not an npm script.
      #
      # `${GITHUB_SHA::7}` matches the width easybook-app stamps into its own bundle, so the two
      # halves of the version screen are comparable by eye — which is the whole point of showing
      # them side by side. `released_at` is the build moment in UTC; the endpoint hands it back
      # untouched, and only the frontend decides how to render it.
      - name: Derive the build stamp
        id: stamp
        run: |
          {
            echo "version=$(node -p "require('./package.json').version")"
            echo "build=${GITHUB_SHA::7}"
            echo "released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push runtime image (app)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          # ⚠️ The app image only. The migrator is a one-shot `prisma migrate deploy` that serves
          # no HTTP and answers no version endpoint — stamping it would only cost a cache miss.
          build-args: |
            APP_VERSION=${{ steps.stamp.outputs.version }}
            APP_BUILD=${{ steps.stamp.outputs.build }}
            APP_RELEASED_AT=${{ steps.stamp.outputs.released_at }}
          # Immutable commit-SHA tag only — never `latest`. The CD workflow deploys this exact
          # tag, so a redeploy is always reproducible and traceable to a commit.
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Own scope per target: with the shared default scope, the migrator export below
          # overwrote this one's cache manifest on every run.
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build & push migrator image (one-shot `prisma migrate deploy`)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrator
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-migrator
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
